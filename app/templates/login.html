<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Monitoring Pembibitan Padi</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-emerald-950 text-slate-900">
    <main class="grid min-h-screen place-items-center px-4">
      <form class="w-full max-w-sm rounded bg-white p-8 shadow-xl" method="post" action="/login">
        <div class="mb-7">
          <div class="mb-4 grid h-12 w-12 place-items-center rounded bg-emerald-600 text-xl font-bold text-white">P</div>
          <h1 class="text-2xl font-semibold">Masuk Dashboard</h1>
          <p class="mt-1 text-sm text-slate-500">Sistem monitoring dan pengendalian pembibitan padi.</p>
        </div>
        <label class="mb-4 block">
          <span class="mb-1 block text-sm font-medium">Email atau username</span>
          <input class="w-full rounded border border-slate-300 px-3 py-2 outline-none focus:border-emerald-600" name="username" value="admin" required>
        </label>
        <label class="mb-6 block">
          <span class="mb-1 block text-sm font-medium">Password</span>
          <input class="w-full rounded border border-slate-300 px-3 py-2 outline-none focus:border-emerald-600" name="password" type="password" value="admin" required>
        </label>
        <button class="w-full rounded bg-emerald-600 px-4 py-2.5 font-semibold text-white hover:bg-emerald-700" type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
